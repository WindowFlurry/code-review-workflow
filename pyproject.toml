[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codereview-agent"
version = "0.1.0"
description = "A LangGraph-based code review agent that grounds every finding in evidence read from disk."
requires-python = ">=3.10"
dependencies = [
    "langchain==1.4.3",
    "langgraph==1.2.12",
    "langchain-deepseek==1.1.1",
    "langgraph-checkpoint-sqlite==3.1.1",
    "pydantic>=2.12",
    "pydantic-settings>=2.12",
    "python-dotenv>=1.1",
    "typer>=0.20",
    "rich>=14.2",
    "tenacity>=9.1",
]

[project.optional-dependencies]
web = ["streamlit>=1.51"]
dev = ["pytest>=8.0"]

[project.scripts]
codereview = "codereview.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

# 示例演示是录好的那次运行，打包时要一起带走。
[tool.setuptools.package-data]
codereview = ["workflow/demo_report.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["network: tests that call a real LLM API (deselected by default)"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]
# Fixtures are deliberately broken: buggy_repo contains seeded defects and
# weird_repo contains binary, GBK, UTF-16 and unparseable files. Linting them
# is meaningless and the errors would drown out real ones.
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RET", "ARG", "PTH"]
ignore = [
    "E501",    # line length is handled by the formatter
    "B008",    # typer uses function calls in argument defaults by design
]
